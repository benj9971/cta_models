[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cta-models"
version = "0.1.0"
description = "Transparent copper trend-positioning proxy for discretionary research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3"]

[project.scripts]
cta-models = "cta_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

